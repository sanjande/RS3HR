<style>
:root{--ink:#0F172A;--em:#0E7C66;--em-d:#0A5F4F;--em-l:#E6F4F0;--amber:#F5B83D;--amber-l:#FEF4DC;--bg:#F1F5F4;--line:#E2E8F0;--mut:#64748B;--txt:#1E293B;--red:#B91C1C;--red-l:#FEE2E2;--blue:#1D4ED8;--blue-l:#DBEAFE;--orange:#C2410C;--orange-l:#FFEDD5;--grey-l:#F1F5F9;--r:14px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.45}
body.noscroll{overflow:hidden}
h1,h2,h3,h4{margin:0;color:var(--ink);line-height:1.25}
h2{font-size:20px}h3{font-size:16px}
p{margin:0 0 8px}
a{color:var(--em)}
button{font:inherit;cursor:pointer}
.mut{color:var(--mut)}.sm{font-size:12px}.r{text-align:right}.c{text-align:center}.b{font-weight:700}.nowrap{white-space:nowrap}
.hide{display:none!important}
/* layout */
.shell{display:flex;min-height:100vh}
.side{width:250px;background:var(--ink);color:#cbd5e1;position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;z-index:40;transition:transform .2s}
.side .brand{padding:18px 16px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #1e293b}
.side .brand .bt{color:#fff;font-weight:800;font-size:17px;line-height:1.1}
.side .brand .bs{font-size:10px;letter-spacing:.14em;color:#94a3b8;text-transform:uppercase;margin-top:3px}
.nav{padding:12px 10px;overflow:auto;flex:1}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;margin-bottom:2px;border-radius:10px;color:#cbd5e1;text-decoration:none;font-weight:500}
.nav a:hover{background:#1e293b;color:#fff}
.nav a.on{background:var(--em);color:#fff}
.nav a .bdg{margin-left:auto;background:var(--amber);color:var(--ink);font-size:11px;font-weight:800;border-radius:20px;padding:1px 7px}
.side .foot{padding:12px 16px;border-top:1px solid #1e293b;font-size:11px;color:#94a3b8}
.main{margin-left:250px;flex:1;min-width:0}
.top{position:sticky;top:0;z-index:30;height:60px;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px}

.icon-btn{background:none;border:0;padding:8px;border-radius:10px;color:var(--ink);position:relative;display:inline-flex}
.icon-btn:hover{background:var(--grey-l)}
.icon-btn .dot{position:absolute;top:2px;right:2px;background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:20px;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.usr{display:flex;align-items:center;gap:10px;padding:4px 8px;border-radius:12px;cursor:pointer;border:0;background:none}
.usr:hover{background:var(--grey-l)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--em);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px}

.content{padding:24px;max-width:1320px;margin:0 auto}
.menu{position:absolute;right:16px;top:56px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(15,23,42,.15);min-width:230px;z-index:60;overflow:hidden}
.menu button,.menu .mi{display:flex;width:100%;align-items:center;gap:10px;padding:10px 14px;background:none;border:0;text-align:left;color:var(--txt)}

.notif{max-height:380px;overflow:auto;width:340px}

.card .ch{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}.card .ch h3{margin:0;flex:1}

.stat.a{border-left-color:var(--amber)}.stat.b{border-left-color:var(--blue)}.stat.r{border-left-color:var(--red)}.stat.o{border-left-color:var(--orange)}.stat.i{border-left-color:var(--ink)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:10px;border:1px solid #cbd5e1;background:#fff;color:var(--ink);font-weight:600;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--grey-l)}
.btn-primary{background:var(--em);border-color:var(--em);color:#fff}.btn-primary:hover{background:var(--em-d)}
.btn-amber{background:var(--amber);border-color:var(--amber);color:var(--ink)}.btn-amber:hover{background:#e9a92c}
.btn-danger{background:var(--red);border-color:var(--red);color:#fff}.btn-danger:hover{background:#991b1b}
.btn-ghost{border-color:transparent;background:transparent;color:var(--em)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.busy{position:relative;color:transparent!important}
.btn.busy::after{content:'';position:absolute;width:16px;height:16px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}

.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* forms */
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}

input,select,textarea{font:inherit;color:var(--txt);padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;width:100%;min-width:0}

input[readonly]{background:var(--grey-l)}
.ck{display:flex;align-items:center;gap:8px;font-weight:500;margin:4px 0}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.filters .f{margin:0;min-width:140px;flex:1}
.rate-banner{background:var(--amber-l);border:1px solid #f3d58b;border-radius:12px;padding:12px 14px;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.rate-banner b{font-size:18px}
.drop{border:2px dashed #b6c4c0;border-radius:12px;padding:18px;text-align:center;color:var(--mut);cursor:pointer;background:#fafdfc}

.files{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.fchip{position:relative;width:110px;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:11px;background:#fff;text-align:center}
.fchip img{width:100%;height:70px;object-fit:cover;border-radius:6px;display:block;margin-bottom:5px}
.fchip .pdf{height:70px;display:flex;align-items:center;justify-content:center;background:var(--red-l);color:var(--red);font-weight:800;border-radius:6px;margin-bottom:5px}
.fchip .rm{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;border:0;background:var(--red);color:#fff;font-weight:700;line-height:1}
.fchip span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* tables */
.tw{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:12px;background:#fff}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{position:sticky;top:0;background:#F8FAFC;text-align:left;padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
.tbl td{padding:10px 12px;border-bottom:1px solid #EEF2F6;vertical-align:middle}
.tbl tr:hover td{background:#FAFCFB}
.tbl tr.click{cursor:pointer}
.tbl .r,.tbl th.r{text-align:right}

.empty{padding:36px 16px;text-align:center;color:var(--mut)}
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:10px 4px;color:var(--mut);font-size:12px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--em);border-bottom-color:var(--em)}
.chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.c-draft{background:#E2E8F0;color:#334155}.c-submitted{background:var(--amber-l);color:#92400E}.c-approved{background:var(--blue-l);color:var(--blue)}
.c-paid{background:#D1FAE5;color:#065F46}.c-rejected{background:var(--red-l);color:var(--red)}.c-returned{background:var(--orange-l);color:var(--orange)}.c-cancelled{background:#E2E8F0;color:#64748B}
.age-hot{color:var(--red);font-weight:700}
/* charts */
.hbr{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:8px;align-items:center;margin:7px 0;font-size:12px}
.hbr .bar{background:#EEF2F6;border-radius:6px;height:14px;overflow:hidden}.hbr .bar i{display:block;height:100%;background:var(--em);border-radius:6px}
.hbr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hbr b{white-space:nowrap}
/* modal */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;z-index:100}
.md{background:#fff;border-radius:16px;width:100%;max-width:540px;box-shadow:0 25px 60px rgba(0,0,0,.3)}
.md.wide{max-width:1040px}.md.mid{max-width:760px}
.mh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.mh .x{border:0;background:none;font-size:26px;line-height:1;color:var(--mut);padding:0 4px}
.mb{padding:18px 20px}.mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;background:#FAFBFC;border-radius:0 0 16px 16px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13px}.kv dt{color:var(--mut)}.kv dd{margin:0;font-weight:600;word-break:break-word}
.cl-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:20px}

.tl li{position:relative;padding:0 0 14px 16px;font-size:13px}.tl li::before{content:'';position:absolute;left:-8px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--em);border:2px solid #fff;box-shadow:0 0 0 1px var(--em)}
.tl li.rej::before{background:var(--red);box-shadow:0 0 0 1px var(--red)}.tl li.ret::before{background:var(--orange);box-shadow:0 0 0 1px var(--orange)}.tl li.neu::before{background:#94a3b8;box-shadow:0 0 0 1px #94a3b8}
.pv{border:1px solid var(--line);border-radius:12px;min-height:200px;background:#F8FAFC;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-top:10px}
.pv img{max-width:100%;max-height:420px}.pv iframe{width:100%;height:440px;border:0}
.alert{padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:12px}
.alert.warn{background:var(--amber-l);border:1px solid #f3d58b}.alert.err{background:var(--red-l);border:1px solid #fecaca;color:#7f1d1d}.alert.info{background:var(--em-l);border:1px solid #b9e0d6}
#toast-root{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px)}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-weight:500;animation:up .2s;border-left:5px solid var(--em)}
.toast.err{border-left-color:var(--red)}.toast.warn{border-left-color:var(--amber)}

.loading{padding:60px;text-align:center;color:var(--mut)}
.spinner{display:inline-block;width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--em);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px}
/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login .lp{background:linear-gradient(150deg,#0F172A 0%,#0b2b2b 100%);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:60px;gap:24px}

.login .rp{display:flex;align-items:center;justify-content:center;padding:30px}
.login .box{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:0 10px 40px rgba(15,23,42,.08)}
.pillrow{display:flex;gap:8px;flex-wrap:wrap}.pill{background:rgba(255,255,255,.1);border-radius:20px;padding:5px 12px;font-size:12px;color:#d6e2ee}
.pwcell{font-family:Consolas,Menlo,monospace;background:var(--grey-l);padding:2px 8px;border-radius:6px}
.fab{display:none}
/* print / PDF */
#print-root{display:none}
.pr-head{display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--em);padding-bottom:10px;margin-bottom:12px}
.pr-head .co{text-align:right;font-size:11px;color:#475569}
.pr-title{font-size:18px;font-weight:800;color:var(--ink);margin:6px 0 2px}.pr-sub{font-size:11px;color:#475569;margin-bottom:10px}
.pr-tbl{width:100%;border-collapse:collapse;font-size:10.5px}.pr-tbl th{background:var(--em);color:#fff;text-align:left;padding:5px 6px}.pr-tbl td{border-bottom:1px solid #dbe3ea;padding:4px 6px}.pr-tbl tfoot td{font-weight:800;background:#E6F4F0}
.pr-tbl .r{text-align:right}
.pr-foot{margin-top:12px;font-size:10px;color:#64748b;border-top:1px solid #cbd5e1;padding-top:6px;display:flex;justify-content:space-between}
.pp{font-size:12px;color:#0f172a}.pp .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 18px;margin:10px 0}.pp .grid div span{display:block;color:#64748b;font-size:10px;text-transform:uppercase;letter-spacing:.05em}
.pp h4{margin:14px 0 6px;font-size:13px;color:var(--em-d);text-transform:uppercase;letter-spacing:.06em}

  body>*:not(#print-root){display:none!important}
  #print-root{display:block!important;position:static}
  body{background:#fff}
  .pb{page-break-after:always;break-after:page}.pb:last-child{page-break-after:auto;break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media(max-width:1000px){.grid2,.grid3,.cl-grid{grid-template-columns:1fr}.login{grid-template-columns:1fr}.login .lp{display:none}}
@media(max-width:900px){
  .side{transform:translateX(-100%)}.side.open{transform:none;box-shadow:0 0 0 100vmax rgba(15,23,42,.5)}
  .main{margin-left:0}.top{padding:0 12px}.top .hb{display:inline-flex}.content{padding:14px}
  .usr .un,.usr .ut{display:none}.row2,.row3{grid-template-columns:1fr}

  .kv{grid-template-columns:105px 1fr}
}
</style>

<body>

<div id="toast-root"></div>

<script>
'use strict';
/* =====================  SET-UP: paste your two Supabase values here  ===================== */
const SUPABASE_URL = 'https://mnluxlwwzyrfbdhmmyev.supabase.co';      // e.g. https://abcdxyz.supabase.co
const SUPABASE_ANON_KEY = 'sb_publishable_hE81PHjT0ui2uJqf3l5LyQ_Ic-YgHre';     // the anon / publishable key (safe to put here)
const LOGO_STYLE = 'A';                                    // 'A' = RS cubed, 'B' = three pillars, 'C' = trio
const DATA_NOTE = 'Data hosted in India (Mumbai)';
const IDLE_MINUTES = 30;                                   // automatic sign-out after this much inactivity
/* ========================================================================================= */

const S = { token: null, user: null, today: null, m: null, unread: 0, seq: 0 };
class AppError extends Error { constructor(m, o) { super(m); Object.assign(this, o || {}); } }
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => [...(el || document).querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const has = r => !!(S.user && S.user.roles.includes(r));
const isApprover = () => has('hr') || has('senior_partner');
const priv = () => has('admin') || has('hr') || has('senior_partner');
const ROLE = { admin: 'Admin', senior_partner: 'Senior Partner', hr: 'HR', accounts: 'Accounts' };
const STATUS = { draft: 'Draft', submitted: 'Pending approval', approved: 'Approved (awaiting payment)', paid: 'Paid', rejected: 'Rejected', returned: 'Returned for correction', cancelled: 'Cancelled' };
const chip = s => `<span class="chip c-${esc(s)}">${esc(STATUS[s] || s)}</span>`;
const KIND = { visit: 'Client visit', expense: 'Expense' };

/* ---------- formatting ---------- */
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const inrFmt = new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', minimumFractionDigits: 2, maximumFractionDigits: 2 });
const inr = n => (n == null || n === '' || isNaN(n)) ? '' : inrFmt.format(+n);
const num = n => new Intl.NumberFormat('en-IN').format(+n || 0);

function downloadBlob(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); }
const safeName = s => String(s).replace(/[^\w\-]+/g, '_').replace(/_+/g, '_').replace(/^_|_$/g, '');
/* A report "spec": { title, sub, cols:[{k,l,t:'text'|'money'|'int'|'date'|'dt'|'chip'}], rows:[{}], totals:{k:val}, fname } */
const cellRaw = (c, r) => { const v = r[c.k]; if (v == null) return ''; if (c.t === 'date') return fmtD(v); if (c.t === 'dt') return fmtDT(v); if (c.t === 'chip') return STATUS[v] || v; return v; };
function cellHTML(c, r) {
  const v = r[c.k]; if (v == null || v === '') return '';
  if (c.t === 'money') return inr(v); if (c.t === 'int') return num(v); if (c.t === 'date') return fmtD(v); if (c.t === 'dt') return fmtDT(v);
  if (c.t === 'chip') return chip(v); if (c.t === 'html') return v; return esc(v);
}
function exportCSV(spec) {
  const q = v => { v = String(v == null ? '' : v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const lines = [spec.cols.map(c => q(c.l)).join(',')];
  spec.rows.forEach(r => lines.push(spec.cols.map(c => q(cellRaw(c, r))).join(',')));
  if (spec.totals) lines.push(spec.cols.map((c, i) => q(spec.totals[c.k] != null ? spec.totals[c.k] : (i === 0 ? 'Total' : ''))).join(','));
  downloadBlob(new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' }), spec.fname + '.csv');
}
function exportXLSX(spec) {
  const co = (S.m && S.m.settings.company_name) || 'RS3 Associates';
  const rows = [[{ v: co, s: 5, nw: 1 }], [{ v: spec.title, s: 6, nw: 1 }], [{ v: spec.sub || '', nw: 1 }], [{ v: 'Generated by ' + S.user.full_name + ' on ' + fmtDT(new Date()), nw: 1 }], []];
  rows.push(spec.cols.map(c => ({ v: c.l, s: 1 })));
  const hdr = rows.length;
  spec.rows.forEach(r => rows.push(spec.cols.map(c => {
    const v = r[c.k]; if (v == null || v === '') return null;
    if (c.t === 'money') return { v: +v, t: 'n', s: 2 }; if (c.t === 'int') return { v: +v, t: 'n' };
    return { v: cellRaw(c, r) };
  })));
  if (spec.totals) rows.push(spec.cols.map((c, i) => { const t = spec.totals[c.k]; if (t != null) return c.t === 'money' ? { v: +t, t: 'n', s: 4 } : (typeof t === 'number' ? { v: t, t: 'n', s: 3 } : { v: t, s: 3 }); return { v: i === 0 ? 'Total' : '', s: 3 }; }));
  downloadBlob(buildXlsx(spec.title, rows, { headerRow: hdr }), spec.fname + '.xlsx');
}

function exportPDF(spec) {

function tableHTML(spec, o) {

let lastAct = Date.now(), timersOn = false;
function startTimers() {
  if (timersOn) return; timersOn = true;
  ['mousemove', 'keydown', 'click', 'touchstart', 'scroll'].forEach(ev => document.addEventListener(ev, () => { lastAct = Date.now(); }, { passive: true }));
  setInterval(() => { if (S.token && Date.now() - lastAct > IDLE_MINUTES * 60000) { sessionStorage.removeItem('rs3_tok'); S.token = null; S.user = null; $$('.ov').forEach(o => o.remove()); document.body.classList.remove('noscroll'); showLogin('You were signed out because of inactivity. Please sign in again.'); } }, 30000);
  setInterval(async () => { if (!S.token) return; try { const me = await call('rs3_me'); setUnread(me.unread); } catch (e) { } }, 60000);
}
async function start() {
  if (!cfg()) { showSetup(); return; }
  const t = sessionStorage.getItem('rs3_tok');
  if (t) { S.token = t; try { await boot(); return; } catch (e) { S.token = null; sessionStorage.removeItem('rs3_tok'); } }
  showLogin();
}

const stat = (l, v, s, c) => `<div class="stat ${c || ''}"><div class="l">${esc(l)}</div><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`;
const ageOf = ts => ts ? Date.now() - new Date(ts).getTime() : null;
const reminderMs = () => (+(S.m && S.m.settings.reminder_days) || 3) * 86400000;
const hbars = (items, fmt, color) => { const mx = Math.max(1, ...items.map(i => +i.v)); return items.length ? items.map(i => `<div class="hbr"><span title="${esc(i.l)}">${esc(i.l)}</span><div class="bar"><i style="width:${Math.max(2, (+i.v / mx) * 100)}%;${i.c || color ? `background:${i.c || color}` : ''}"></i></div><b>${fmt(i.v)}</b></div>`).join('') : '<div class="empty">No data yet.</div>'; };
function trendSVG(items) {
  const W = 640, H = 220, pl = 8, pb = 26, pt = 24, mx = Math.max(1, ...items.map(i => +i.amount)), bw = (W - pl * 2) / items.length;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Monthly claims">`;
  items.forEach((it, i) => {
    const h = (H - pb - pt) * (+it.amount / mx), x = pl + i * bw + bw * .15, y = H - pb - h;
    s += `<rect x="${x}" y="${y}" width="${bw * .7}" height="${Math.max(h, 1.5)}" rx="4" fill="#0E7C66"><title>${monthLabel(it.month)}: ${inr(it.amount)} (${it.count} claims)</title></rect>`;
    if (+it.amount > 0) s += `<text x="${x + bw * .35}" y="${y - 5}" font-size="9.5" text-anchor="middle" fill="#334155">${shortINR(it.amount)}</text>`;
    s += `<text x="${x + bw * .35}" y="${H - 8}" font-size="10" text-anchor="middle" fill="#64748b">${MON[+it.month.slice(5, 7) - 1]}</text>`;
  });
  return s + '</svg>';
}

}

ACT['ls-edit'] = el => { const x = lsList().find(i => i.id === +el.dataset.id); modal(`${mh('Rename')}<div class="mb"><div class="f"><label>Name *</label><input id="l-name" maxlength="80" value="${esc(x.name)}"></div></div><div class="mf"><button class="btn" data-act="close">Cancel</button><button class="btn btn-primary" data-act="ls-save" data-id="${x.id}">Save</button></div>`); };
ACT['ls-save'] = async el => { const ov = el.closest('.ov'), id = el.dataset.id ? +el.dataset.id : null, x = id ? lsList().find(i => i.id === id) : null; await lock(el, () => call('rs3_list_save', { p_kind: lsKind(), p: { id, name: $('#l-name', ov).value.trim(), active: x ? x.active : true } })); closeModal(ov); toast('Saved'); render(); };
ACT['ls-toggle'] = async el => { const x = lsList().find(i => i.id === +el.dataset.id); await call('rs3_list_save', { p_kind: lsKind(), p: { id: x.id, name: x.name, active: !x.active } }); toast(x.active ? 'Deactivated' : 'Activated'); render(); };
ACT['set-save'] = async el => { const k = el.dataset.k, inp = $(`[data-set="${k}"]`); await lock(el, () => call('rs3_setting_set', { p_key: k, p_value: inp.value.trim() })); S.m = await call('rs3_masters'); toast('Setting saved'); };

/* ---------- Audit log ---------- */
async function pgAudit() {
  if (!priv()) return deny();
  const rows = await call('rs3_audit_list', { p_limit: 500 }), spec = { title: 'Audit log', sub: 'Most recent 500 entries', fname: 'RS3_Audit_log_' + S.today, cols: [{ k: 'at', l: 'When', t: 'dt' }, { k: 'actor_name', l: 'User' }, { k: 'action', l: 'Action' }, { k: 'detail', l: 'Details' }], rows };
  RP.auditSpec = spec;
  return { title: 'Audit log', html: `<div class="card"><div class="ch"><h3>Audit log</h3><button class="btn" data-act="au-exp" data-t="xlsx">${ico('download')} Excel</button><button class="btn" data-act="au-exp" data-t="csv">${ico('download')} CSV</button><button class="btn" data-act="au-exp" data-t="pdf">${ico('print')} PDF</button></div><p class="mut sm">Every sign-in, change and decision is recorded here and cannot be edited or deleted.</p>${tableHTML(spec)}</div>` };
}
ACT['au-exp'] = el => ({ xlsx: exportXLSX, csv: exportCSV, pdf: exportPDF })[el.dataset.t](RP.auditSpec);

/* ---------- Profile / change password ---------- */
function pgProfile() {
  return {
    title: 'My profile', html: `<div class="card" style="max-width:520px;margin:0 auto"><h2 style="margin-bottom:12px">${esc(S.user.full_name)}</h2><dl class="kv" style="margin-bottom:18px"><dt>User ID</dt><dd>${esc(S.user.login)}</dd><dt>Designation</dt><dd>${esc(S.user.designation_name || '-')}</dd><dt>Role</dt><dd>${esc(S.user.title)}</dd></dl><h3 style="margin-bottom:10px">Change password</h3>
    <div class="f"><label>Current password</label><input type="password" id="pw-old" autocomplete="current-password"></div><div class="f"><label>New password</label><input type="password" id="pw-new" autocomplete="new-password"><span class="hint">At least 4 characters</span></div><div class="f"><label>Repeat new password</label><input type="password" id="pw-new2" autocomplete="new-password"></div><button class="btn btn-primary" data-act="pw-save">Change password</button></div>`
  };
}
ACT['pw-save'] = async el => {
  const a = $('#pw-old').value, b = $('#pw-new').value, c = $('#pw-new2').value; if (!a || !b) throw new AppError('Please fill in all the fields.'); if (b.length < 4) throw new AppError('The new password must be at least 4 characters.'); if (b !== c) throw new AppError('The two new passwords do not match.');
  await lock(el, () => call('rs3_change_password', { p_old: a, p_new: b })); ['#pw-old', '#pw-new', '#pw-new2'].forEach(s => $(s).value = ''); toast('Password changed');
};

if ('serviceWorker' in navigator && location.protocol === 'https:') window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
start();
</script>
</body>
